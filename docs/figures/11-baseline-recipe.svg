<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">基準レシピの時間軸</title><desc id="desc">粉15グラム、湯240グラムを例に、蒸らしと注湯、落ち切りを記録する</desc><rect width="1200" height="650" fill="#fbf7ef"/><text x="60" y="65" font-family="sans-serif" font-size="34" font-weight="700" fill="#243d32">最初の一杯は「比較できる記録」を作る</text><g font-family="sans-serif"><rect x="70" y="105" width="1060" height="90" rx="20" fill="#e7efe7"/><g font-size="22" fill="#2d332f" text-anchor="middle"><text x="250" y="145">粉量 15 g</text><text x="470" y="145">総湯量 240 g</text><text x="690" y="145">粉液比 1:16</text><text x="910" y="145">湯温 90〜93 ℃</text><text x="600" y="178" font-size="18" fill="#665f56">豆・水・器具・挽き目も記録する</text></g><line x1="120" y1="335" x2="1080" y2="335" stroke="#8b8177" stroke-width="5"/><g fill="#315441"><circle cx="150" cy="335" r="15"/><circle cx="350" cy="335" r="15"/><circle cx="600" cy="335" r="15"/><circle cx="850" cy="335" r="15"/><circle cx="1050" cy="335" r="15"/></g><g text-anchor="middle"><g font-size="21" font-weight="700" fill="#2d332f"><text x="150" y="290">0秒</text><text x="350" y="290">蒸らし終了</text><text x="600" y="290">第2投</text><text x="850" y="290">最終投</text><text x="1050" y="290">落ち切り</text></g><g font-size="19" fill="#665f56"><text x="150" y="390">注湯開始</text><text x="350" y="390">乾いた粉がないか</text><text x="600" y="390">開始時刻・湯量</text><text x="850" y="390">累計湯量</text><text x="1050" y="390">総時間</text></g></g><rect x="160" y="475" width="880" height="90" rx="18" fill="#f3e6d4"/><text x="600" y="515" text-anchor="middle" font-size="22" fill="#2d332f">数値は万能レシピではなく、次の一杯と比較するための基準</text><text x="600" y="550" text-anchor="middle" font-size="18" fill="#665f56">一項目だけ変え、同じ形式で味を記録する。</text></g></svg>
