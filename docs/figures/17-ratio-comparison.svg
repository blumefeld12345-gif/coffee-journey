<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">粉液比の比較</title><desc id="desc">粉15グラムに対して湯225、240、255グラムを比べる</desc><rect width="1200" height="620" fill="#fbf7ef"/><text x="60" y="65" font-family="sans-serif" font-size="34" font-weight="700" fill="#243d32">粉15 gを固定し、湯量で比率を比べる</text><g font-family="sans-serif" text-anchor="middle"><g><rect x="90" y="125" width="300" height="370" rx="24" fill="#f3e6d4"/><rect x="450" y="125" width="300" height="370" rx="24" fill="#e7efe7"/><rect x="810" y="125" width="300" height="370" rx="24" fill="#edf1f2"/></g><g font-size="32" font-weight="700" fill="#2d332f"><text x="240" y="190">1:15</text><text x="600" y="190">1:16</text><text x="960" y="190">1:17</text></g><g fill="#7a4b2f"><circle cx="240" cy="265" r="36"/><circle cx="600" cy="265" r="36"/><circle cx="960" cy="265" r="36"/></g><g font-size="22" fill="#2d332f"><text x="240" y="335">粉 15 g</text><text x="240" y="380">湯 225 g</text><text x="600" y="335">粉 15 g</text><text x="600" y="380">湯 240 g</text><text x="960" y="335">粉 15 g</text><text x="960" y="380">湯 255 g</text></g><g font-size="18" fill="#665f56"><text x="240" y="445">濃い方向へ動きやすい</text><text x="600" y="445">比較の基準例</text><text x="960" y="445">薄い方向へ動きやすい</text></g><text x="600" y="550" font-size="20" fill="#665f56">湯量は粉を通る水の量も変えるため、抽出度への影響も記録する。</text></g></svg>
