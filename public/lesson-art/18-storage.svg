<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">鮮度と保管</title><desc id="desc">酸素、光、高温、多湿、結露を避け、密閉して保管する</desc><rect width="1200" height="650" fill="#fbf7ef"/><text x="60" y="65" font-family="sans-serif" font-size="34" font-weight="700" fill="#243d32">豆の状態も、抽出結果を変える条件</text><g font-family="sans-serif" text-anchor="middle"><rect x="455" y="165" width="290" height="330" rx="35" fill="#315441"/><path d="M500 165V120H700V165" fill="none" stroke="#315441" stroke-width="18"/><text x="600" y="285" font-size="30" font-weight="700" fill="white">密閉容器</text><text x="600" y="335" font-size="21" fill="#dce9df">焙煎日・開封日を記録</text><text x="600" y="375" font-size="21" fill="#dce9df">必要量だけ取り出す</text><g fill="#f1dfdc" stroke="#b5665c" stroke-width="2"><rect x="70" y="130" width="220" height="75" rx="18"/><rect x="70" y="240" width="220" height="75" rx="18"/><rect x="70" y="350" width="220" height="75" rx="18"/><rect x="70" y="460" width="220" height="75" rx="18"/></g><g font-size="23" fill="#8d423d"><text x="180" y="178">酸素</text><text x="180" y="288">光</text><text x="180" y="398">高温・多湿</text><text x="180" y="508">冷蔵庫の結露</text></g><g fill="#e7efe7"><rect x="900" y="190" width="230" height="90" rx="18"/><rect x="900" y="350" width="230" height="90" rx="18"/></g><g font-size="22" fill="#315441"><text x="1015" y="228">比較時は</text><text x="1015" y="258">同程度の鮮度</text><text x="1015" y="388">状態が変われば</text><text x="1015" y="418">記録へ残す</text></g><g stroke="#8b8177" stroke-width="3"><path d="M290 168H455"/><path d="M290 278H455"/><path d="M290 388H455"/><path d="M290 498H455"/><path d="M745 235H900"/><path d="M745 395H900"/></g><text x="600" y="590" font-size="20" fill="#665f56">保存で時間を止めることはできない。変化を小さくし、比較条件として管理する。</text></g></svg>
