<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc">
  <title id="title">均一な濡れと偏流</title><desc id="desc">蒸らしで均一に濡れた粉層と乾いた部分が残る粉層の流れを比較する</desc><rect width="1200" height="710" fill="#fbf7ef"/><text x="60" y="65" font-family="sans-serif" font-size="34" font-weight="700" fill="#243d32">蒸らしは、粉全体を濡らして流れの偏りを減らす</text>
  <g font-family="sans-serif"><text x="330" y="130" text-anchor="middle" font-size="28" font-weight="700" fill="#315441">均一に濡れた粉層</text><path d="M130 180H530L455 565H205Z" fill="#e7efe7" stroke="#315441" stroke-width="5"/><path d="M195 275Q330 225 465 275L430 455Q330 500 230 455Z" fill="#79513b"/><g stroke="#5f91b1" stroke-width="8" stroke-linecap="round"><path d="M245 205V395"/><path d="M330 205V420"/><path d="M415 205V395"/></g><g fill="#c5e5ee"><circle cx="245" cy="198" r="11"/><circle cx="330" cy="198" r="11"/><circle cx="415" cy="198" r="11"/></g><text x="330" y="615" text-anchor="middle" font-size="21" fill="#2d332f">広い範囲へ湯が届く</text><text x="330" y="650" text-anchor="middle" font-size="19" fill="#665f56">注湯位置・湯量・軽い揺すりを再現</text>
  <text x="870" y="130" text-anchor="middle" font-size="28" font-weight="700" fill="#8d423d">乾いた部分が残る粉層</text><path d="M670 180H1070L995 565H745Z" fill="#f1dfdc" stroke="#8d423d" stroke-width="5"/><path d="M735 275Q870 225 1005 275L970 455Q870 500 770 455Z" fill="#79513b"/><path d="M910 258Q1000 300 965 445Q920 480 875 455Q930 360 910 258" fill="#d7c19f"/><g stroke="#5f91b1" stroke-width="9" stroke-linecap="round"><path d="M780 205Q770 320 800 430"/><path d="M820 205Q805 330 835 450"/></g><text x="870" y="615" text-anchor="middle" font-size="21" fill="#2d332f">一部へ湯が集中する</text><text x="870" y="650" text-anchor="middle" font-size="19" fill="#665f56">待ち時間だけ延ばしても乾いた粉は濡れない</text></g></svg>
