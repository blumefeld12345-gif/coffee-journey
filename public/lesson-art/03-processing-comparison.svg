<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">精製方法の工程比較</title><desc id="desc">ウォッシュド、ナチュラル、ハニーで乾燥時に残る層を比較する</desc>
  <rect width="1200" height="760" fill="#fbf7ef"/><text x="60" y="65" font-family="sans-serif" font-size="34" font-weight="700" fill="#243d32">乾燥するとき、種の周囲に何が残っているか</text>
  <g font-family="sans-serif"><g transform="translate(55 120)"><rect width="340" height="560" rx="24" fill="#e6eef1"/><text x="170" y="52" text-anchor="middle" font-size="27" font-weight="700" fill="#294f5a">ウォッシュド</text><circle cx="170" cy="160" r="82" fill="#e9c56f"/><circle cx="170" cy="160" r="60" fill="#9eb79d"/><text x="170" y="280" text-anchor="middle" font-size="21" fill="#2d332f">果皮・果肉を除く</text><path d="M170 300V350" stroke="#294f5a" stroke-width="4"/><text x="170" y="390" text-anchor="middle" font-size="21" fill="#2d332f">粘液質を除く</text><text x="170" y="455" text-anchor="middle" font-size="20" fill="#665f56">パーチメントの状態で乾燥</text><text x="170" y="510" text-anchor="middle" font-size="18" fill="#665f56">発酵・洗浄などの</text><text x="170" y="537" text-anchor="middle" font-size="18" fill="#665f56">具体的方法は生産者で異なる</text></g>
  <g transform="translate(430 120)"><rect width="340" height="560" rx="24" fill="#f1dfdc"/><text x="170" y="52" text-anchor="middle" font-size="27" font-weight="700" fill="#8d423d">ナチュラル</text><circle cx="170" cy="160" r="95" fill="#a94e45"/><circle cx="170" cy="160" r="72" fill="#d88957"/><circle cx="170" cy="160" r="52" fill="#9eb79d"/><text x="170" y="300" text-anchor="middle" font-size="21" fill="#2d332f">チェリーのまま乾燥</text><path d="M170 320V370" stroke="#8d423d" stroke-width="4"/><text x="170" y="410" text-anchor="middle" font-size="21" fill="#2d332f">乾燥後に果皮・果肉を除く</text><text x="170" y="485" text-anchor="middle" font-size="18" fill="#665f56">果実の熟度、乾燥層、攪拌、</text><text x="170" y="512" text-anchor="middle" font-size="18" fill="#665f56">天候管理が品質へ関わる</text></g>
  <g transform="translate(805 120)"><rect width="340" height="560" rx="24" fill="#f3ead0"/><text x="170" y="52" text-anchor="middle" font-size="27" font-weight="700" fill="#7a5a20">ハニー</text><circle cx="170" cy="160" r="82" fill="#e9c56f"/><circle cx="170" cy="160" r="58" fill="#9eb79d"/><text x="170" y="280" text-anchor="middle" font-size="21" fill="#2d332f">果皮を除く</text><path d="M170 300V350" stroke="#7a5a20" stroke-width="4"/><text x="170" y="390" text-anchor="middle" font-size="21" fill="#2d332f">粘液質を残して乾燥</text><text x="170" y="455" text-anchor="middle" font-size="20" fill="#665f56">蜂蜜を加える方法ではない</text><text x="170" y="510" text-anchor="middle" font-size="18" fill="#665f56">残し方や乾燥法は</text><text x="170" y="537" text-anchor="middle" font-size="18" fill="#665f56">名称だけでは確定できない</text></g></g>
  <text x="600" y="730" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#665f56">どの方法でも、発酵・乾燥・選別の管理が味と保存性に関わる。</text>
</svg>
