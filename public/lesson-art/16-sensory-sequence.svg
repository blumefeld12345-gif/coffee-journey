<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">味を観察する順序</title><desc id="desc">飲む前、口に含む、飲み込んだ後、温度変化の順に香り、味、質感、後味を記録する</desc><rect width="1200" height="660" fill="#fbf7ef"/><text x="60" y="65" font-family="sans-serif" font-size="34" font-weight="700" fill="#243d32">「おいしい」の前に、感じたものを順番に観察する</text><g font-family="sans-serif" text-anchor="middle"><g><rect x="55" y="130" width="250" height="370" rx="24" fill="#edf1f2"/><rect x="335" y="130" width="250" height="370" rx="24" fill="#e7efe7"/><rect x="615" y="130" width="250" height="370" rx="24" fill="#f3e6d4"/><rect x="895" y="130" width="250" height="370" rx="24" fill="#f1dfdc"/></g><g font-size="26" font-weight="700" fill="#2d332f"><text x="180" y="185">飲む前</text><text x="460" y="185">口に含む</text><text x="740" y="185">飲み込む</text><text x="1020" y="185">冷める途中</text></g><g font-size="21" fill="#2d332f"><text x="180" y="255">立ち上がる香り</text><text x="180" y="300">強さと種類</text><text x="460" y="255">酸・甘さ・苦味</text><text x="460" y="300">口中から鼻へ抜ける香り</text><text x="460" y="345">軽い・滑らか・重い</text><text x="740" y="255">残る香味</text><text x="740" y="300">長さ</text><text x="740" y="345">乾き・渋さ</text><text x="1020" y="255">酸の質</text><text x="1020" y="300">甘さ</text><text x="1020" y="345">後味の変化</text></g><g font-size="18" fill="#665f56"><text x="180" y="440">香り</text><text x="460" y="440">味＋質感</text><text x="740" y="440">後味</text><text x="1020" y="440">温度差</text></g><path d="M305 315H335M585 315H615M865 315H895" stroke="#8b8177" stroke-width="4"/><text x="600" y="570" font-size="22" fill="#2d332f">種類 → 強さ → 質の順で言葉にする</text><text x="600" y="610" font-size="19" fill="#665f56">例：「酸っぱい」ではなく「柑橘を思わせる、明るい酸が中程度」。</text></g></svg>
