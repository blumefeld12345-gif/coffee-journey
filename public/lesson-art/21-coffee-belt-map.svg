<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">コーヒーベルトと本書の24生産国</title><desc id="desc">赤道周辺の熱帯・亜熱帯と、中南米、アフリカ・イエメン、アジア・太平洋の対象国の位置</desc><rect width="1200" height="760" fill="#fbf7ef"/><text x="45" y="55" font-family="sans-serif" font-size="32" font-weight="700" fill="#243d32">コーヒーベルトと、本書で扱う24の生産国</text><g transform="translate(0 75)"><image href="world-base-public-domain.svg" x="20" y="20" width="1160" height="588" opacity="0.33"/><rect x="20" y="225" width="1160" height="230" fill="#d8b56a" opacity="0.18"/><g stroke="#a8743c" stroke-width="2" stroke-dasharray="8 8"><line x1="20" y1="225" x2="1180" y2="225"/><line x1="20" y1="340" x2="1180" y2="340"/><line x1="20" y1="455" x2="1180" y2="455"/></g><g font-family="sans-serif" font-size="16" fill="#7a5a20"><text x="35" y="215">北回帰線</text><text x="35" y="330">赤道</text><text x="35" y="480">南回帰線</text></g><g fill="#315441" stroke="#fff" stroke-width="3"><circle cx="330" cy="330" r="9"/><circle cx="365" cy="365" r="9"/><circle cx="405" cy="400" r="9"/><circle cx="445" cy="450" r="9"/><circle cx="485" cy="425" r="9"/><circle cx="160" cy="310" r="9"/><circle cx="680" cy="365" r="9"/><circle cx="690" cy="405" r="9"/><circle cx="675" cy="430" r="9"/><circle cx="715" cy="350" r="9"/><circle cx="820" cy="360" r="9"/><circle cx="900" cy="365" r="9"/><circle cx="930" cy="430" r="9"/><circle cx="1030" cy="435" r="9"/></g><g font-family="sans-serif" font-size="18" font-weight="700" fill="#243d32"><text x="250" y="520">中南米・カリブ 14か国</text><text x="585" y="520">アフリカ・イエメン 6か国</text><text x="865" y="520">アジア・太平洋 4か国</text></g></g><text x="600" y="725" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#665f56">点は国のおおよその位置。コーヒーは国全体ではなく、条件の合う地域で栽培される。</text></svg>
