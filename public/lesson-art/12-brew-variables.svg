<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">抽出条件の関係</title><desc id="desc">粉液比、挽き目、湯温、注湯、器具が濃度、流れ、抽出へ関係する</desc><rect width="1200" height="720" fill="#fbf7ef"/><text x="60" y="65" font-family="sans-serif" font-size="34" font-weight="700" fill="#243d32">一つの変数が、複数の結果へつながる</text><g font-family="sans-serif"><g fill="#f3e6d4" stroke="#b68761" stroke-width="2"><rect x="60" y="130" width="210" height="70" rx="16"/><rect x="60" y="240" width="210" height="70" rx="16"/><rect x="60" y="350" width="210" height="70" rx="16"/><rect x="60" y="460" width="210" height="70" rx="16"/><rect x="60" y="570" width="210" height="70" rx="16"/></g><g fill="#2d332f" font-size="22" text-anchor="middle"><text x="165" y="173">粉液比</text><text x="165" y="283">挽き目・微粉</text><text x="165" y="393">湯温</text><text x="165" y="503">注湯・攪拌</text><text x="165" y="613">器具・フィルター</text></g><g fill="#e7efe7" stroke="#6d9478" stroke-width="2"><rect x="480" y="185" width="240" height="90" rx="20"/><rect x="480" y="330" width="240" height="90" rx="20"/><rect x="480" y="475" width="240" height="90" rx="20"/></g><g font-size="24" font-weight="700" fill="#315441" text-anchor="middle"><text x="600" y="240">濃度</text><text x="600" y="385">流れ・接触時間</text><text x="600" y="530">抽出の進みと均一性</text></g><g fill="#edf1f2" stroke="#66818a" stroke-width="2"><rect x="930" y="220" width="210" height="90" rx="20"/><rect x="930" y="410" width="210" height="90" rx="20"/></g><g font-size="24" font-weight="700" fill="#3f5960" text-anchor="middle"><text x="1035" y="275">味・香り</text><text x="1035" y="465">質感・後味</text></g><g stroke="#8b8177" stroke-width="3" fill="none"><path d="M270 165H430V230H480"/><path d="M270 275H400V375H480"/><path d="M270 385H440V520H480"/><path d="M270 495H390V375H480"/><path d="M270 605H430V520H480"/><path d="M720 230H830V265H930"/><path d="M720 375H860V455H930"/><path d="M720 520H830V265H930"/><path d="M720 520H880V455H930"/></g><text x="600" y="680" text-anchor="middle" font-size="20" fill="#665f56">矢印は主な関係。実際には条件同士も影響し合うため、一度に一つずつ比較する。</text></g></svg>
