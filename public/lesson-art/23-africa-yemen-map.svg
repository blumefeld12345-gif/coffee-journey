<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">アフリカ東部とイエメンの生産国</title><desc id="desc">エチオピア、ケニア、ルワンダ、ブルンジ、タンザニア、イエメンの位置関係</desc><rect width="1200" height="760" fill="#fbf7ef"/><text x="45" y="55" font-family="sans-serif" font-size="32" font-weight="700" fill="#243d32">アフリカ東部・イエメン：国境より、地域と処理拠点を読む</text><g transform="translate(0 80)"><image href="world-base-public-domain.svg" x="-410" y="-20" width="1400" height="709" opacity="0.25"/><g font-family="sans-serif" font-size="21" fill="#243d32" stroke="#fff" stroke-width="4" paint-order="stroke"><circle cx="560" cy="310" r="10" fill="#315441" stroke="none"/><text x="580" y="300">エチオピア</text><circle cx="585" cy="365" r="10" fill="#315441" stroke="none"/><text x="605" y="360">ケニア</text><circle cx="520" cy="395" r="10" fill="#315441" stroke="none"/><text x="300" y="390">ルワンダ／ブルンジ</text><circle cx="570" cy="430" r="10" fill="#315441" stroke="none"/><text x="590" y="450">タンザニア</text><circle cx="650" cy="285" r="10" fill="#315441" stroke="none"/><text x="670" y="275">イエメン</text></g></g><g font-family="sans-serif"><rect x="750" y="155" width="390" height="405" rx="24" fill="#e7efe7"/><text x="780" y="205" font-size="24" font-weight="700" fill="#315441">由来を追う主な単位</text><g font-size="20" fill="#2d332f"><text x="790" y="265">エチオピア：地域・精製所</text><text x="790" y="315">ケニア：地域・ファクトリー</text><text x="790" y="365">ルワンダ／ブルンジ：</text><text x="810" y="398">地域・ステーション</text><text x="790" y="448">タンザニア：北部／南部高地</text><text x="790" y="498">イエメン：山地・ロットの由来</text></g></g><text x="600" y="720" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#665f56">点は国のおおよその位置。共同処理ロットでは農園名がないこともある。</text></svg>
