<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">コーヒーチェリーの断面</title><desc id="desc">外側から果皮、果肉、粘液質、パーチメント、種が並ぶ構造図</desc>
  <rect width="1200" height="680" fill="#fbf7ef"/><text x="60" y="70" font-family="sans-serif" font-size="34" font-weight="700" fill="#243d32">コーヒーチェリーの中に「豆」ができる</text>
  <ellipse cx="430" cy="365" rx="270" ry="220" fill="#a94e45"/><ellipse cx="430" cy="365" rx="225" ry="178" fill="#d88957"/><ellipse cx="430" cy="365" rx="178" ry="140" fill="#e9c56f"/><ellipse cx="365" cy="365" rx="82" ry="118" fill="#ede2b9"/><ellipse cx="495" cy="365" rx="82" ry="118" fill="#ede2b9"/><ellipse cx="365" cy="365" rx="65" ry="100" fill="#9eb79d"/><ellipse cx="495" cy="365" rx="65" ry="100" fill="#9eb79d"/>
  <g font-family="sans-serif" font-size="25" fill="#2d332f" stroke="#2d332f" stroke-width="2"><path d="M665 240H790"/><text x="810" y="248" stroke="none">果皮</text><path d="M620 300H790"/><text x="810" y="308" stroke="none">果肉</text><path d="M585 355H790"/><text x="810" y="363" stroke="none">粘液質</text><path d="M550 420H790"/><text x="810" y="428" stroke="none">パーチメント（内果皮）</text><path d="M530 490H790"/><text x="810" y="498" stroke="none">種＝精製後の生豆</text></g>
  <text x="60" y="635" font-family="sans-serif" font-size="22" fill="#665f56">通常は二つの種が向かい合う。精製では周囲の層を取り除き、乾燥して保存できる生豆にする。</text>
</svg>
