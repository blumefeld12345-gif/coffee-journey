<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">ドリッパー構造の比較</title><desc id="desc">円すい、平底、台形の形だけでなく穴、リブ、フィルター、粉層で流れが決まる</desc><rect width="1200" height="660" fill="#fbf7ef"/><text x="60" y="65" font-family="sans-serif" font-size="34" font-weight="700" fill="#243d32">形の名前だけで、流速や味は決まらない</text><g font-family="sans-serif" text-anchor="middle"><g transform="translate(80 125)"><rect width="300" height="400" rx="24" fill="#edf1f2"/><text x="150" y="55" font-size="27" font-weight="700" fill="#3f5960">円すい型</text><path d="M55 110H245L175 300H125Z" fill="none" stroke="#3f5960" stroke-width="6"/><circle cx="150" cy="315" r="8" fill="#3f5960"/><text x="150" y="350" font-size="19" fill="#2d332f">粉層が深くなりやすい</text><text x="150" y="380" font-size="18" fill="#665f56">穴・リブ・注ぎ方も確認</text></g><g transform="translate(450 125)"><rect width="300" height="400" rx="24" fill="#e7efe7"/><text x="150" y="55" font-size="27" font-weight="700" fill="#315441">平底型</text><path d="M55 110H245L225 285H75Z" fill="none" stroke="#315441" stroke-width="6"/><line x1="75" y1="285" x2="225" y2="285" stroke="#315441" stroke-width="8"/><g fill="#315441"><circle cx="115" cy="310" r="7"/><circle cx="150" cy="310" r="7"/><circle cx="185" cy="310" r="7"/></g><text x="150" y="350" font-size="19" fill="#2d332f">底面へ粉が広がりやすい</text><text x="150" y="380" font-size="18" fill="#665f56">底形状と穴数も製品で異なる</text></g><g transform="translate(820 125)"><rect width="300" height="400" rx="24" fill="#f3e6d4"/><text x="150" y="55" font-size="27" font-weight="700" fill="#7a4b2f">台形型</text><path d="M55 110H245L215 285H85Z" fill="none" stroke="#7a4b2f" stroke-width="6"/><line x1="85" y1="285" x2="215" y2="285" stroke="#7a4b2f" stroke-width="8"/><circle cx="150" cy="310" r="7" fill="#7a4b2f"/><text x="150" y="350" font-size="19" fill="#2d332f">台形の粉層を作る</text><text x="150" y="380" font-size="18" fill="#665f56">穴数と紙の密着も確認</text></g><text x="600" y="590" font-size="21" fill="#2d332f">構造 → 流れ → 接触の仕方 → 味</text><text x="600" y="625" font-size="18" fill="#665f56">同じ豆と条件で流れを観察し、その後に器具に合う挽き目を探す。</text></g></svg>
