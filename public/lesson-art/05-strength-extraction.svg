<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">濃度と抽出状態の四象限</title><desc id="desc">濃い薄いと抽出が進んだ進んでいないを別の軸で示す</desc>
  <rect width="1200" height="760" fill="#fbf7ef"/><text x="60" y="65" font-family="sans-serif" font-size="34" font-weight="700" fill="#243d32">「濃い・薄い」と「抽出の進み」は別の軸</text>
  <g font-family="sans-serif"><rect x="210" y="125" width="780" height="500" fill="#fff" stroke="#8b8177" stroke-width="3"/><line x1="600" y1="125" x2="600" y2="625" stroke="#8b8177" stroke-width="3"/><line x1="210" y1="375" x2="990" y2="375" stroke="#8b8177" stroke-width="3"/>
  <rect x="214" y="129" width="382" height="242" fill="#f3e6d4"/><rect x="604" y="129" width="382" height="242" fill="#e7efe7"/><rect x="214" y="379" width="382" height="242" fill="#edf1f2"/><rect x="604" y="379" width="382" height="242" fill="#eef0df"/>
  <g text-anchor="middle" fill="#2d332f"><text x="405" y="190" font-size="25" font-weight="700">濃いが、抽出は進んでいない</text><text x="405" y="238" font-size="20">少ない湯・短い接触など</text><text x="405" y="285" font-size="20">濃さと鋭い酸が同居する場合</text><text x="795" y="190" font-size="25" font-weight="700">濃く、抽出も進んでいる</text><text x="795" y="238" font-size="20">狙いなら問題ではない</text><text x="795" y="285" font-size="20">重さ・苦味・渋さを分けて観察</text><text x="405" y="445" font-size="25" font-weight="700">薄く、抽出も進んでいない</text><text x="405" y="493" font-size="20">低濃度と酸の突出など</text><text x="405" y="540" font-size="20">比率と抽出を別々に検証</text><text x="795" y="445" font-size="25" font-weight="700">薄いが、抽出は進んでいる</text><text x="795" y="493" font-size="20">多い湯で十分に取り出した場合など</text><text x="795" y="540" font-size="20">薄さだけで抽出不足と決めない</text></g>
  <text x="600" y="690" text-anchor="middle" font-size="23" fill="#2d332f">抽出が進んでいない　←　粉から取り出した割合　→　抽出が進んでいる</text><text x="100" y="380" transform="rotate(-90 100 380)" text-anchor="middle" font-size="23" fill="#2d332f">薄い　←　液体の濃度　→　濃い</text></g>
  <text x="600" y="735" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#665f56">味だけから確定せず、レシピ記録や測定値を使って原因候補を検証する。</text>
</svg>
