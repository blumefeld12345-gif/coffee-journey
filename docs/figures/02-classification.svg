<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">種・品種・精製の分類</title><desc id="desc">植物の分類と収穫後工程が別の情報であることを示す</desc>
  <rect width="1200" height="650" fill="#fbf7ef"/><text x="60" y="70" font-family="sans-serif" font-size="34" font-weight="700" fill="#243d32">植物の情報と、収穫後の工程を分ける</text>
  <g font-family="sans-serif"><rect x="60" y="120" width="500" height="450" rx="24" fill="#e7efe7"/><text x="95" y="165" font-size="26" font-weight="700" fill="#315441">植物の分類</text><rect x="115" y="205" width="390" height="74" rx="16" fill="#315441"/><text x="310" y="252" text-anchor="middle" font-size="25" fill="white">種：アラビカ</text><path d="M310 280V325" stroke="#315441" stroke-width="4"/><rect x="95" y="325" width="130" height="70" rx="14" fill="#fff"/><rect x="245" y="325" width="130" height="70" rx="14" fill="#fff"/><rect x="395" y="325" width="130" height="70" rx="14" fill="#fff"/><g font-size="21" fill="#2d332f" text-anchor="middle"><text x="160" y="367">ブルボン</text><text x="310" y="367">カトゥーラ</text><text x="460" y="367">ゲシャ</text></g><text x="310" y="445" text-anchor="middle" font-size="23" fill="#315441">品種・栽培系統</text><text x="310" y="500" text-anchor="middle" font-size="19" fill="#665f56">樹の性質や可能性に関係する</text>
  <rect x="640" y="120" width="500" height="450" rx="24" fill="#f3e6d4"/><text x="675" y="165" font-size="26" font-weight="700" fill="#7a4b2f">収穫後の工程</text><rect x="695" y="205" width="390" height="74" rx="16" fill="#a86a3e"/><text x="890" y="252" text-anchor="middle" font-size="25" fill="white">精製</text><path d="M890 280V325" stroke="#a86a3e" stroke-width="4"/><g><rect x="665" y="325" width="140" height="70" rx="14" fill="#fff"/><rect x="820" y="325" width="140" height="70" rx="14" fill="#fff"/><rect x="975" y="325" width="140" height="70" rx="14" fill="#fff"/></g><g font-size="20" fill="#2d332f" text-anchor="middle"><text x="735" y="367">ウォッシュド</text><text x="890" y="367">ナチュラル</text><text x="1045" y="367">ハニー</text></g><text x="890" y="445" text-anchor="middle" font-size="23" fill="#7a4b2f">果実から生豆を作る方法</text><text x="890" y="500" text-anchor="middle" font-size="19" fill="#665f56">品種とは別の情報</text></g>
  <text x="600" y="620" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#665f56">例：「アラビカ／カトゥーラ／ウォッシュド」＝ 種／品種／精製</text>
</svg>
