<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">挽き目、粒度分布、流れ</title><desc id="desc">粗い粒、中心粒、微粉が抽出と流れへ与える影響</desc><rect width="1200" height="700" fill="#fbf7ef"/><text x="60" y="65" font-family="sans-serif" font-size="34" font-weight="700" fill="#243d32">同じ目盛りでも、粉の大きさは一つではない</text>
  <g font-family="sans-serif"><rect x="70" y="125" width="320" height="430" rx="24" fill="#efe6d9"/><text x="230" y="175" text-anchor="middle" font-size="27" font-weight="700" fill="#6d4933">大きな粒</text><g fill="#8c6144"><circle cx="160" cy="270" r="45"/><circle cx="275" cy="300" r="55"/><circle cx="205" cy="400" r="50"/></g><text x="230" y="495" text-anchor="middle" font-size="20" fill="#2d332f">中心まで湯が届きにくく</text><text x="230" y="525" text-anchor="middle" font-size="20" fill="#2d332f">抽出が遅い場合がある</text>
  <rect x="440" y="125" width="320" height="430" rx="24" fill="#e7efe7"/><text x="600" y="175" text-anchor="middle" font-size="27" font-weight="700" fill="#315441">狙った中心粒</text><g fill="#8c6144"><circle cx="535" cy="275" r="27"/><circle cx="610" cy="255" r="29"/><circle cx="670" cy="315" r="26"/><circle cx="545" cy="365" r="30"/><circle cx="630" cy="405" r="28"/></g><text x="600" y="495" text-anchor="middle" font-size="20" fill="#2d332f">粒の大きさが近いほど</text><text x="600" y="525" text-anchor="middle" font-size="20" fill="#2d332f">抽出をそろえやすい</text>
  <rect x="810" y="125" width="320" height="430" rx="24" fill="#edf1f2"/><text x="970" y="175" text-anchor="middle" font-size="27" font-weight="700" fill="#3f5960">微粉</text><g fill="#8c6144"><circle cx="900" cy="255" r="9"/><circle cx="930" cy="280" r="7"/><circle cx="980" cy="250" r="10"/><circle cx="1030" cy="290" r="8"/><circle cx="1060" cy="255" r="6"/><circle cx="900" cy="345" r="8"/><circle cx="945" cy="370" r="10"/><circle cx="990" cy="340" r="7"/><circle cx="1035" cy="380" r="9"/><circle cx="1070" cy="350" r="7"/></g><path d="M860 420H1080" stroke="#8c6144" stroke-width="10"/><text x="970" y="495" text-anchor="middle" font-size="20" fill="#2d332f">速く抽出され、隙間を塞いで</text><text x="970" y="525" text-anchor="middle" font-size="20" fill="#2d332f">流れを遅くする場合がある</text></g>
  <text x="600" y="620" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2d332f">粒度分布 ＝ 一回の粉に含まれる粒の大きさの広がり</text><text x="600" y="660" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#665f56">挽き目の目盛りだけでなく、落ち切り時間と味のばらつきも記録する。</text></svg>
