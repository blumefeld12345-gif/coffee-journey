<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">焙煎による豆の変化</title><desc id="desc">生豆から浅煎り、中煎り、深煎りへ色、構造、香味、抽出されやすさが変化する</desc><rect width="1200" height="650" fill="#fbf7ef"/><text x="60" y="65" font-family="sans-serif" font-size="34" font-weight="700" fill="#243d32">焙煎で、色・構造・香味の現れ方が変わる</text><g font-family="sans-serif" text-anchor="middle"><path d="M130 300H1070" stroke="#8b8177" stroke-width="4"/><path d="M1040 280L1080 300L1040 320" fill="none" stroke="#8b8177" stroke-width="4"/><g><ellipse cx="180" cy="245" rx="65" ry="85" fill="#9eb79d"/><ellipse cx="460" cy="245" rx="72" ry="92" fill="#b98050"/><ellipse cx="740" cy="245" rx="78" ry="98" fill="#79513b"/><ellipse cx="1020" cy="245" rx="83" ry="103" fill="#3e2b24"/></g><g font-size="25" font-weight="700" fill="#2d332f"><text x="180" y="390">生豆</text><text x="460" y="390">浅煎り</text><text x="740" y="390">中煎り</text><text x="1020" y="390">深煎り</text></g><g font-size="19" fill="#665f56"><text x="180" y="435">水分を含む</text><text x="180" y="465">硬く緻密</text><text x="460" y="435">花・柑橘・果実を</text><text x="460" y="465">識別しやすい傾向</text><text x="740" y="435">素材と加熱由来の</text><text x="740" y="465">特徴が重なりやすい</text><text x="1020" y="435">香ばしさ・カカオ・苦味が</text><text x="1020" y="465">前に出やすい傾向</text></g><text x="600" y="555" font-size="22" fill="#2d332f">加熱が進む　→　膨らむ・多孔質になる・もろくなる・成分が移りやすくなる傾向</text><text x="600" y="600" font-size="18" fill="#665f56">焙煎度名の境界は共通ではない。色、店の説明、実際の味も確認する。</text></g></svg>
