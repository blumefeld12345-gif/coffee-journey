<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">レシピ改善の循環</title><desc id="desc">狙う味、基準、観察、一変数変更、再現を循環する</desc><rect width="1200" height="720" fill="#fbf7ef"/><text x="60" y="65" font-family="sans-serif" font-size="34" font-weight="700" fill="#243d32">よいレシピは、一度の正解ではなく再現できる循環</text>
  <g font-family="sans-serif"><g fill="#315441"><path d="M600 120A235 235 0 0 1 820 270L780 285A195 195 0 0 0 600 160Z"/><path d="M835 320A235 235 0 0 1 735 550L710 515A195 195 0 0 0 795 325Z"/><path d="M690 580A235 235 0 0 1 425 535L450 500A195 195 0 0 0 675 540Z"/><path d="M385 500A235 235 0 0 1 375 245L415 260A195 195 0 0 0 420 475Z"/><path d="M405 210A235 235 0 0 1 555 125L565 165A195 195 0 0 0 430 245Z"/></g>
  <g fill="#fff" font-size="22" font-weight="700" text-anchor="middle"><text x="690" y="175">1 狙う味</text><text x="785" y="405">2 基準を作る</text><text x="590" y="565">3 観察する</text><text x="390" y="410">4 一つ変える</text><text x="470" y="190">5 再現する</text></g><circle cx="600" cy="350" r="135" fill="#e7efe7"/><text x="600" y="325" text-anchor="middle" font-size="28" font-weight="700" fill="#315441">記録する</text><text x="600" y="370" text-anchor="middle" font-size="20" fill="#2d332f">数値と味を</text><text x="600" y="402" text-anchor="middle" font-size="20" fill="#2d332f">同じ形式で残す</text>
  <g fill="#665f56" font-size="18"><text x="845" y="235">香り・酸・甘さ・質感・後味</text><text x="870" y="505">粉量・湯量・挽き目・温度・注湯</text><text x="500" y="660">狙いと一致した点／違った点</text><text x="80" y="520">原因候補に直結する変数だけ</text><text x="95" y="180">同条件でもう一度淹れる</text></g></g></svg>
