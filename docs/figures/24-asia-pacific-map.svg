<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">アジア・太平洋の生産国</title><desc id="desc">インド、ベトナム、インドネシア、パプアニューギニアの位置関係</desc><rect width="1200" height="760" fill="#fbf7ef"/><text x="45" y="55" font-family="sans-serif" font-size="32" font-weight="700" fill="#243d32">アジア・太平洋：種、島・高地、加工工程を分けて読む</text><g transform="translate(0 70)"><image href="world-base-public-domain.svg" x="-740" y="-10" width="1700" height="861" opacity="0.25"/><g font-family="sans-serif" font-size="22" fill="#243d32" stroke="#fff" stroke-width="4" paint-order="stroke"><circle cx="455" cy="345" r="10" fill="#315441" stroke="none"/><text x="390" y="325">インド</text><circle cx="610" cy="350" r="10" fill="#315441" stroke="none"/><text x="630" y="340">ベトナム</text><circle cx="640" cy="455" r="10" fill="#315441" stroke="none"/><text x="480" y="480">インドネシア</text><circle cx="825" cy="460" r="10" fill="#315441" stroke="none"/><text x="845" y="455">パプアニューギニア</text></g></g><g font-family="sans-serif"><rect x="790" y="135" width="360" height="240" rx="24" fill="#e7efe7"/><text x="820" y="185" font-size="23" font-weight="700" fill="#315441">最初の確認</text><g font-size="20" fill="#2d332f"><text x="830" y="240">種：アラビカ／カネフォラ</text><text x="830" y="285">地域：島・州・高地</text><text x="830" y="330">工程：通常精製／固有加工</text></g></g><text x="600" y="720" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#665f56">点は国のおおよその位置。インドネシアは多数の島からなり、国名だけでは精製を決められない。</text></svg>
