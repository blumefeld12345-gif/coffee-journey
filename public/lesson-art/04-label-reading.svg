<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">商品ラベルの読み方</title><desc id="desc">架空の商品ラベルを由来、品種、精製、焙煎、風味説明へ分類する</desc>
  <rect width="1200" height="720" fill="#fbf7ef"/><text x="60" y="65" font-family="sans-serif" font-size="34" font-weight="700" fill="#243d32">ラベルを「情報の種類」に分ける</text>
  <g font-family="sans-serif"><rect x="365" y="115" width="470" height="525" rx="28" fill="#315441"/><text x="600" y="175" text-anchor="middle" font-size="22" fill="#dce9df">単一由来のコーヒー</text><text x="600" y="230" text-anchor="middle" font-size="38" font-weight="700" fill="white">コロンビア</text><text x="600" y="278" text-anchor="middle" font-size="29" fill="white">ウイラ　ラ・エスペランサ農園</text><line x1="425" y1="310" x2="775" y2="310" stroke="#8da99a"/><text x="440" y="360" font-size="23" fill="white">品種　カトゥーラ</text><text x="440" y="405" font-size="23" fill="white">精製　ウォッシュド</text><text x="440" y="450" font-size="23" fill="white">焙煎　中浅煎り</text><text x="440" y="520" font-size="21" fill="#dce9df">柑橘・キャラメル・赤い果実</text><text x="440" y="580" font-size="18" fill="#dce9df">焙煎日　2026年10月10日</text>
  <g fill="#2d332f" font-size="22" stroke="#7d746a" stroke-width="2"><path d="M365 225H170"/><text x="65" y="232" stroke="none">国</text><path d="M365 270H170"/><text x="65" y="277" stroke="none">地域・農園</text><path d="M835 350H1030"/><text x="1050" y="357" stroke="none">品種</text><path d="M835 395H1030"/><text x="1050" y="402" stroke="none">精製</text><path d="M835 440H1030"/><text x="1050" y="447" stroke="none">焙煎度</text><path d="M365 510H170"/><text x="45" y="517" stroke="none">風味説明</text><path d="M835 570H1030"/><text x="1050" y="577" stroke="none">鮮度情報</text></g></g>
  <text x="600" y="687" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#665f56">表示が細かいことは品質保証ではないが、比較と再購入の精度を高める。</text>
</svg>
