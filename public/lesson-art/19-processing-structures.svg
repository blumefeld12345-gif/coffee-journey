<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">共同処理とマイクロミル</title><desc id="desc">複数農家のチェリーを集めるウォッシングステーションと生産者が管理する小規模精製施設を比較する</desc><rect width="1200" height="700" fill="#fbf7ef"/><text x="60" y="65" font-family="sans-serif" font-size="34" font-weight="700" fill="#243d32">農園名がなくても、由来を追える場合がある</text><g font-family="sans-serif" text-anchor="middle"><rect x="55" y="120" width="520" height="500" rx="25" fill="#edf1f2"/><text x="315" y="170" font-size="28" font-weight="700" fill="#3f5960">ウォッシングステーション</text><g fill="#9eb79d"><circle cx="145" cy="275" r="48"/><circle cx="260" cy="250" r="48"/><circle cx="375" cy="275" r="48"/></g><g font-size="18" fill="#2d332f"><text x="145" y="345">農家A</text><text x="260" y="320">農家B</text><text x="375" y="345">農家C</text></g><path d="M145 360L315 435M260 335L315 435M375 360L315 435" stroke="#66818a" stroke-width="4"/><rect x="205" y="430" width="220" height="80" rx="18" fill="#3f5960"/><text x="315" y="480" font-size="22" fill="white">共同で選別・精製</text><text x="315" y="555" font-size="18" fill="#665f56">地域・施設名・収穫期が重要</text><rect x="625" y="120" width="520" height="500" rx="25" fill="#e7efe7"/><text x="885" y="170" font-size="28" font-weight="700" fill="#315441">マイクロミル</text><circle cx="760" cy="300" r="65" fill="#9eb79d"/><text x="760" y="390" font-size="19" fill="#2d332f">農園・小規模生産者</text><path d="M825 300H915" stroke="#6d9478" stroke-width="4"/><rect x="915" y="250" width="180" height="100" rx="18" fill="#315441"/><text x="1005" y="290" font-size="20" fill="white">自ら管理する</text><text x="1005" y="320" font-size="20" fill="white">選別・精製</text><text x="885" y="475" font-size="18" fill="#665f56">農園・区画・精製ロットを</text><text x="885" y="505" font-size="18" fill="#665f56">細かく追える場合がある</text><text x="600" y="665" font-size="19" fill="#665f56">名称の使われ方は地域で異なる。袋では施設名、地域、ロット、精製を確認する。</text></g></svg>
