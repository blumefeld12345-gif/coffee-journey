<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc"><title id="title">味から次の検証を選ぶ診断図</title><desc id="desc">濃さ、酸と甘さ、渋さ、再現性を順番に観察し一つの変更を選ぶ</desc><rect width="1200" height="820" fill="#fbf7ef"/><text x="60" y="60" font-family="sans-serif" font-size="34" font-weight="700" fill="#243d32">味を一語で決めず、順番に原因候補を分ける</text><g font-family="sans-serif" text-anchor="middle"><rect x="450" y="95" width="300" height="64" rx="18" fill="#315441"/><text x="600" y="136" font-size="23" fill="white">濃さは狙いどおりか</text><path d="M450 127H250V210" stroke="#8b8177" stroke-width="3" fill="none"/><path d="M750 127H950V210" stroke="#8b8177" stroke-width="3" fill="none"/><text x="330" y="115" font-size="18" fill="#665f56">薄い／濃い</text><text x="875" y="115" font-size="18" fill="#665f56">狙いどおり</text><rect x="95" y="210" width="310" height="105" rx="18" fill="#f3e6d4"/><text x="250" y="248" font-size="22" font-weight="700" fill="#7a4b2f">粉液比を小さく動かす</text><text x="250" y="280" font-size="17" fill="#665f56">抽出への影響も記録する</text><rect x="795" y="210" width="310" height="105" rx="18" fill="#e7efe7"/><text x="950" y="248" font-size="22" font-weight="700" fill="#315441">味の質を観察する</text><text x="950" y="280" font-size="17" fill="#665f56">酸・甘さ・苦味・渋さ</text><path d="M950 315V380H600" stroke="#8b8177" stroke-width="3" fill="none"/><g><rect x="50" y="380" width="340" height="125" rx="18" fill="#edf1f2"/><rect x="430" y="380" width="340" height="125" rx="18" fill="#f1dfdc"/><rect x="810" y="380" width="340" height="125" rx="18" fill="#eef0df"/></g><g font-size="21" font-weight="700" fill="#2d332f"><text x="220" y="425">酸が突出し、甘さが弱い</text><text x="600" y="425">乾いた渋さ・流れが遅い</text><text x="980" y="425">味が毎回変わる</text></g><g font-size="17" fill="#665f56"><text x="220" y="462">抽出を少し進める候補を一つ</text><text x="600" y="462">微粉・詰まり・攪拌を確認</text><text x="980" y="462">計量・粒度・注湯を確認</text></g><g stroke="#8b8177" stroke-width="3"><path d="M220 505V575"/><path d="M600 505V575"/><path d="M980 505V575"/></g><rect x="190" y="575" width="820" height="80" rx="20" fill="#315441"/><text x="600" y="625" font-size="25" fill="white">変更は一つだけ → 同じ形式で味と時間を記録</text><path d="M600 655V710" stroke="#8b8177" stroke-width="3"/><rect x="410" y="710" width="380" height="65" rx="18" fill="#f3e6d4"/><text x="600" y="751" font-size="22" fill="#2d332f">良ければ同条件で再現する</text></g></svg>
