<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc"><title id="title">生育環境と成熟の関係</title><desc id="desc">標高だけでなく緯度、斜面、雲、風、雨、品種と管理が成熟と品質へ関わる</desc><rect width="1200" height="690" fill="#fbf7ef"/><text x="60" y="65" font-family="sans-serif" font-size="34" font-weight="700" fill="#243d32">標高は品質点数ではなく、気温などを考える手掛かり</text><g font-family="sans-serif" text-anchor="middle"><g fill="#f3e6d4" stroke="#b68761" stroke-width="2"><rect x="55" y="130" width="190" height="65" rx="16"/><rect x="55" y="225" width="190" height="65" rx="16"/><rect x="55" y="320" width="190" height="65" rx="16"/><rect x="55" y="415" width="190" height="65" rx="16"/><rect x="55" y="510" width="190" height="65" rx="16"/></g><g font-size="21" fill="#2d332f"><text x="150" y="171">標高・緯度</text><text x="150" y="266">斜面・日照</text><text x="150" y="361">雲・風</text><text x="150" y="456">雨季・乾季</text><text x="150" y="551">海からの距離</text></g><rect x="430" y="215" width="260" height="105" rx="22" fill="#e7efe7"/><text x="560" y="260" font-size="26" font-weight="700" fill="#315441">微気候</text><text x="560" y="292" font-size="18" fill="#665f56">気温・水分・光</text><rect x="430" y="410" width="260" height="105" rx="22" fill="#edf1f2"/><text x="560" y="455" font-size="25" font-weight="700" fill="#3f5960">品種・栽培管理</text><text x="560" y="487" font-size="18" fill="#665f56">適応・樹の健康・熟度</text><rect x="875" y="215" width="270" height="105" rx="22" fill="#f3ead0"/><text x="1010" y="260" font-size="25" font-weight="700" fill="#7a5a20">果実の成熟</text><text x="1010" y="292" font-size="18" fill="#665f56">速度と成分形成</text><rect x="875" y="410" width="270" height="105" rx="22" fill="#f1dfdc"/><text x="1010" y="455" font-size="25" font-weight="700" fill="#8d423d">収穫時の品質</text><text x="1010" y="487" font-size="18" fill="#665f56">精製・焙煎の前提</text><g stroke="#8b8177" stroke-width="3" fill="none"><path d="M245 162H335V267H430"/><path d="M245 257H430"/><path d="M245 352H335V267H430"/><path d="M245 447H335V267H430"/><path d="M245 542H335V267H430"/><path d="M690 267H875"/><path d="M690 462H785V267H875"/><path d="M1010 320V410"/></g><text x="600" y="640" font-size="20" fill="#665f56">同じ標高でも、緯度や斜面、品種、管理が違えば成熟条件は異なる。</text></g></svg>
