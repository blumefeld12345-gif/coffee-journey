<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">比較試飲の設計</title><desc id="desc">知りたい違いを一つ選び、その他の条件を近づける</desc><rect width="1200" height="680" fill="#fbf7ef"/><text x="60" y="65" font-family="sans-serif" font-size="34" font-weight="700" fill="#243d32">知りたい違いを一つ選び、ほかの条件を近づける</text><g font-family="sans-serif"><rect x="70" y="120" width="1060" height="90" rx="22" fill="#315441"/><text x="600" y="175" text-anchor="middle" font-size="27" fill="white">例：精製方法による違いを観察したい</text><g><rect x="70" y="250" width="490" height="315" rx="24" fill="#e7efe7"/><rect x="640" y="250" width="490" height="315" rx="24" fill="#f3e6d4"/></g><g text-anchor="middle"><text x="315" y="305" font-size="26" font-weight="700" fill="#315441">できるだけ固定する</text><text x="885" y="305" font-size="26" font-weight="700" fill="#7a4b2f">変える</text><g font-size="22" fill="#2d332f"><text x="315" y="365">農園または近い地域</text><text x="315" y="410">品種</text><text x="315" y="455">焙煎度</text><text x="315" y="500">抽出レシピ</text><text x="885" y="385">ウォッシュド</text><text x="885" y="430">↕</text><text x="885" y="475">ナチュラル</text></g></g><text x="600" y="625" text-anchor="middle" font-size="20" fill="#665f56">そろわない条件は隠さず記録し、感じた差を精製だけへ断定しない。</text></g></svg>
