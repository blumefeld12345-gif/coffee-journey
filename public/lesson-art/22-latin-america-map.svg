<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">中南米とカリブの生産国</title><desc id="desc">本書で扱う14か国を北から南へ位置関係で示す</desc><rect width="1200" height="760" fill="#fbf7ef"/><text x="45" y="55" font-family="sans-serif" font-size="32" font-weight="700" fill="#243d32">中南米・カリブ：山脈、火山、高地を地域名と重ねる</text><g transform="translate(0 70)"><image href="world-base-public-domain.svg" x="-80" y="0" width="1200" height="608" opacity="0.28"/><g font-family="sans-serif" font-size="18" fill="#243d32" stroke="#fff" stroke-width="4" paint-order="stroke"><circle cx="235" cy="295" r="8" fill="#315441" stroke="none"/><text x="250" y="285">メキシコ</text><circle cx="285" cy="340" r="8" fill="#315441" stroke="none"/><text x="125" y="350">グアテマラ／エルサルバドル</text><circle cx="315" cy="360" r="8" fill="#315441" stroke="none"/><text x="330" y="350">ホンジュラス／ニカラグア</text><circle cx="340" cy="385" r="8" fill="#315441" stroke="none"/><text x="350" y="405">コスタリカ／パナマ</text><circle cx="375" cy="325" r="8" fill="#315441" stroke="none"/><text x="390" y="315">ジャマイカ</text><circle cx="120" cy="280" r="8" fill="#315441" stroke="none"/><text x="75" y="265">ハワイ</text><circle cx="395" cy="410" r="8" fill="#315441" stroke="none"/><text x="410" y="400">コロンビア</text><circle cx="375" cy="445" r="8" fill="#315441" stroke="none"/><text x="270" y="465">エクアドル</text><circle cx="395" cy="485" r="8" fill="#315441" stroke="none"/><text x="315" y="510">ペルー</text><circle cx="440" cy="500" r="8" fill="#315441" stroke="none"/><text x="455" y="520">ボリビア</text><circle cx="500" cy="460" r="8" fill="#315441" stroke="none"/><text x="520" y="465">ブラジル</text></g></g><g font-family="sans-serif"><rect x="720" y="145" width="430" height="445" rx="24" fill="#e7efe7"/><text x="750" y="195" font-size="24" font-weight="700" fill="#315441">地図の次に読むもの</text><g font-size="20" fill="#2d332f"><text x="760" y="250">1　国の中の地域名</text><text x="760" y="300">2　山脈・斜面・標高と微気候</text><text x="760" y="350">3　品種と精製</text><text x="760" y="400">4　農園・協同組合・ロット</text><text x="760" y="450">5　焙煎度と実際の風味説明</text></g><text x="760" y="525" font-size="18" fill="#665f56">国の位置は入口であり、味の答えではない。</text></g><text x="600" y="720" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#665f56">小国の点は読みやすさのため近接して表示。正確な産地区画を示す地図ではない。</text></svg>
