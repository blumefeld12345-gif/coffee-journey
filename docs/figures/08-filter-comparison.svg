<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">紙と金属フィルターの比較</title><desc id="desc">油分と微粒子の通りやすさ、質感の傾向を比較する</desc><rect width="1200" height="690" fill="#fbf7ef"/><text x="60" y="65" font-family="sans-serif" font-size="34" font-weight="700" fill="#243d32">フィルターは、液体へ通すものを変える</text>
  <g font-family="sans-serif"><rect x="70" y="120" width="500" height="490" rx="26" fill="#edf1f2"/><text x="320" y="172" text-anchor="middle" font-size="29" font-weight="700" fill="#3f5960">紙フィルター</text><path d="M175 225H465L410 450H230Z" fill="#fff" stroke="#8b8177" stroke-width="5"/><g fill="#cf9a50"><circle cx="260" cy="285" r="15"/><circle cx="325" cy="320" r="12"/><circle cx="390" cy="280" r="14"/></g><g fill="#6f4c38"><circle cx="285" cy="375" r="7"/><circle cx="350" cy="395" r="8"/><circle cx="405" cy="355" r="6"/></g><path d="M240 458Q320 505 400 458" fill="#9b633d"/><text x="320" y="535" text-anchor="middle" font-size="20" fill="#2d332f">油分・微粒子を保持しやすい</text><text x="320" y="570" text-anchor="middle" font-size="20" fill="#2d332f">比較的澄んだ質感になりやすい</text>
  <rect x="630" y="120" width="500" height="490" rx="26" fill="#f3e6d4"/><text x="880" y="172" text-anchor="middle" font-size="29" font-weight="700" fill="#7a4b2f">金属フィルター</text><path d="M735 225H1025L970 450H790Z" fill="#d8c3a5" stroke="#7a4b2f" stroke-width="5"/><g fill="#cf9a50"><circle cx="820" cy="300" r="15"/><circle cx="880" cy="335" r="12"/><circle cx="945" cy="290" r="14"/><circle cx="835" cy="475" r="12"/><circle cx="925" cy="480" r="11"/></g><g fill="#6f4c38"><circle cx="825" cy="380" r="7"/><circle cx="895" cy="405" r="8"/><circle cx="950" cy="365" r="6"/><circle cx="865" cy="490" r="7"/></g><path d="M800 505Q880 555 960 505" fill="#815136"/><text x="880" y="570" text-anchor="middle" font-size="20" fill="#2d332f">油分・微粒子を通しやすい</text><text x="880" y="600" text-anchor="middle" font-size="20" fill="#2d332f">豊かな質感になりやすい</text></g><text x="600" y="655" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#665f56">優劣ではなく、欲しい質感・手入れ・再現性で選ぶ。</text></svg>
